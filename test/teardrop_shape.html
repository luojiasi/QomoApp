<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>水滴 / 梨形（Teardrop）—— 三段弧相切画法</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --text: #e7eaf0;
    --muted: #8b93a5;
    --accent: #4da3ff;
    --accent2: #ff7a59;
    --accent3: #4dd8a8;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .wrap {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  canvas {
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .field label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field label b { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat {
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .note {
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .formula {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--accent3);
    line-height: 1.7;
    overflow-x: auto;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <h1>水滴 / 梨形（Teardrop）＝ 顶部半圆 + 左右侧弧</h1>
  <p class="sub">三段弧两两相切：半圆在肩点与侧弧相切，左右侧弧在尖端汇合（左右镜像对称）</p>

  <div class="wrap">
    <canvas id="cv" width="620" height="620"></canvas>
    <div class="panel">
      <div class="field">
        <label>半宽 a <b id="va">1.00</b></label>
        <input id="a" type="range" min="0.4" max="1.5" step="0.01" value="1.0" />
      </div>
      <div class="field">
        <label>尖端深度 L <b id="vL">2.20</b></label>
        <input id="L" type="range" min="0.5" max="3.5" step="0.01" value="2.2" />
      </div>

      <div class="stats">
        <div class="stat"><div class="k">总长 (a+L)</div><div class="v" id="sLen">—</div></div>
        <div class="stat"><div class="k">总宽 (2a)</div><div class="v" id="sWid">—</div></div>
        <div class="stat"><div class="k">长宽比</div><div class="v" id="sRatio">—</div></div>
        <div class="stat"><div class="k">尖端夹角</div><div class="v" id="sTip">—</div></div>
      </div>

      <div class="formula">cx = (a² − L²) / (2a)<br/>r  = (a² + L²) / (2a)</div>

      <div class="legend">
        <div class="row"><span class="swatch" style="background:var(--accent3)"></span> 顶部半圆（rounded end）</div>
        <div class="row"><span class="swatch" style="background:var(--accent)"></span> 右侧弧（右肩 → 尖端）</div>
        <div class="row"><span class="swatch" style="background:var(--accent2)"></span> 左侧弧（尖端 → 左肩）</div>
        <div class="row"><span class="swatch" style="background:#ffd166"></span> 对称轴 / 圆心</div>
      </div>

      <div class="note">
        水滴只有<b>左右镜像对称</b>（1 条轴），没有旋转对称，不能像垫型那样用
        「四分之一 × 90°」闭合，需沿完整轮廓走一整圈三段弧。
        理想长宽比 1.50–1.75；L &gt; a 时尖端更尖。
      </div>
    </div>
  </div>

<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const CX = W / 2, CY = H / 2;

  const elA = document.getElementById('a');
  const elL = document.getElementById('L');
  const va = document.getElementById('va');
  const vL = document.getElementById('vL');
  const sLen = document.getElementById('sLen');
  const sWid = document.getElementById('sWid');
  const sRatio = document.getElementById('sRatio');
  const sTip = document.getElementById('sTip');

  // 数学坐标 -> 画布坐标（y 向上翻转）
  function makePx(a, L) {
    const scale = Math.min(160, (CY - 40) / (a + L));
    return function (x, y) {
      return [CX + x * scale, CY - y * scale];
    };
  }

  // 采样一段圆弧，从角度 t0 到 t1
  function arcPoints(cx, cy, r, t0, t1, steps) {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = t0 + (t1 - t0) * (i / steps);
      pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
    }
    return pts;
  }

  function trace(pts, px) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => {
      const [sx, sy] = px(x, y);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.stroke();
  }

  function render() {
    const a = parseFloat(elA.value);
    const L = parseFloat(elL.value);
    va.textContent = a.toFixed(2);
    vL.textContent = L.toFixed(2);

    const px = makePx(a, L);
    const cx = (a * a - L * L) / (2 * a);
    const r = (a * a + L * L) / (2 * a);
    const tipRight = Math.atan2(-L, -cx);      // 右侧弧尖端角度（负，第4象限）
    let tipLeft = Math.atan2(-L, cx);          // 左侧弧尖端角度（相对圆心 -cx）
    if (tipLeft < 0) tipLeft += 2 * Math.PI;   // 转成 [π, 2π) 范围（第3象限）
    const tipDeg = 2 * Math.atan(Math.abs(a * a - L * L) / (2 * a * L)) * 180 / Math.PI;

    const totalLen = a + L;
    sLen.textContent = totalLen.toFixed(2);
    sWid.textContent = (2 * a).toFixed(2);
    sRatio.textContent = (totalLen / (2 * a)).toFixed(3) + ':1';
    sTip.textContent = tipDeg.toFixed(1) + '°';

    ctx.clearRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const span = Math.ceil(totalLen);
    for (let i = -span; i <= span; i++) {
      const [x1] = px(i, 0); ctx.beginPath(); ctx.moveTo(x1, 0); ctx.lineTo(x1, H); ctx.stroke();
      const [, y1] = px(0, i); ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(W, y1); ctx.stroke();
    }

    // 对称轴（y 轴）
    ctx.strokeStyle = 'rgba(255,209,102,0.5)';
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    const [ax0, ay0] = px(0, a + 10);
    const [ax1, ay1] = px(0, -L - 10);
    ctx.moveTo(ax0, ay0); ctx.lineTo(ax1, ay1); ctx.stroke();
    ctx.setLineDash([]);

    const SEG = 90;

    // 1) 顶部半圆（左肩 -> 右肩，逆时针走上半）
    const top = arcPoints(0, 0, a, Math.PI, 0, SEG);
    ctx.strokeStyle = '#4dd8a8';
    ctx.lineWidth = 3;
    trace(top, px);

    // 2) 右侧弧（右肩 (a,0) -> 尖端 (0,-L)）
    const right = arcPoints(cx, 0, r, 0, tipRight, SEG);
    ctx.strokeStyle = '#4da3ff';
    trace(right, px);

    // 3) 左侧弧（尖端 (0,-L) -> 左肩 (-a,0)），圆心 -cx，角度 π -> tipLeft
    const left = arcPoints(-cx, 0, r, Math.PI, tipLeft, SEG);
    ctx.strokeStyle = '#ff7a59';
    trace(left, px);

    // 圆心标记
    ctx.fillStyle = '#ffd166';
    [[0, 0], [cx, 0], [-cx, 0]].forEach(([x, y]) => {
      const [sx, sy] = px(x, y);
      ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI * 2); ctx.fill();
    });

    // 肩点 & 尖端
    ctx.fillStyle = '#fff';
    [[a, 0], [-a, 0], [0, -L]].forEach(([x, y]) => {
      const [sx, sy] = px(x, y);
      ctx.beginPath(); ctx.arc(sx, sy, 4, 0, Math.PI * 2); ctx.fill();
    });
  }

  [elA, elL].forEach((el) => el.addEventListener('input', render));
  render();
})();
</script>
</body>
</html>
