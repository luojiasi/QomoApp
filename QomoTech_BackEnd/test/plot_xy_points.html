<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>XY 点位</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e7eaf0; --muted:#8b93a5; --border:#2a2f3a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  h1 { font-size:16px; margin:0; }
  .sub { color:var(--muted); font-size:12px; margin:4px 0 0; }
  .ctrl { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); }
  .ctrl label { display:flex; align-items:center; gap:4px; }
  .main { flex:1; min-height:0; display:grid; grid-template-columns:1fr 280px; }
  svg { width:100%; height:100%; background:#0a0c10; }
  .dot { cursor:pointer; }
  .tip { position:fixed; z-index:10; pointer-events:none; display:none;
    background:#1e293b; color:#e7eaf0; border:1px solid #334155; border-radius:6px;
    padding:6px 8px; font-size:12px; font-variant-numeric:tabular-nums;
    font-family:ui-monospace,monospace; white-space:nowrap; }
  aside { border-left:1px solid var(--border); overflow:auto; padding:12px; font-size:12px; background:var(--panel); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:3px 4px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel); }
  tr.active { background:#1e3a5f; }
  tr { cursor:pointer; }
  .stat { margin:0 0 10px; line-height:1.55; color:var(--muted); }
  .stat b { color:var(--text); }
</style>
</head>
<body>
<header>
  <div>
    <h1>XY 点位</h1>
    <p class="sub">Y 向上 · 绿点=起点 · 粉点=终点 · 点击点或表格行可高亮</p>
  </div>
  <div class="ctrl">
    <label><input type="checkbox" id="showLine" checked /> 连线</label>
    <label><input type="checkbox" id="showIndex" checked /> 点号</label>
    <label><input type="checkbox" id="showAxes" checked /> 坐标轴</label>
  </div>
</header>
<div class="main">
  <svg id="svg" viewBox="-1.85938 -1.35887 3.71875 3.71875"></svg>
  <div class="tip" id="tip"></div>
  <aside>
    <p class="stat" id="stats"></p>
    <table>
      <thead><tr><th>#</th><th>X</th><th>Y</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </aside>
</div>
<script>
const POINTS = [{"x": 1.0, "y": 0.0}, {"x": 0.995974, "y": 0.089639}, {"x": 0.98393, "y": 0.178557}, {"x": 0.963963, "y": 0.266037}, {"x": 0.936235, "y": 0.351375}, {"x": 0.900969, "y": 0.433884}, {"x": 0.858449, "y": 0.512899}, {"x": 0.809017, "y": 0.587785}, {"x": 0.753071, "y": 0.657939}, {"x": 0.691063, "y": 0.722795}, {"x": 0.62349, "y": 0.781831}, {"x": 0.550897, "y": 0.834573}, {"x": 0.473869, "y": 0.880596}, {"x": 0.393025, "y": 0.919528}, {"x": 0.309017, "y": 0.951057}, {"x": 0.222521, "y": 0.974928}, {"x": 0.134233, "y": 0.99095}, {"x": 0.044865, "y": 0.998993}, {"x": -0.044865, "y": 0.998993}, {"x": -0.134233, "y": 0.99095}, {"x": -0.222521, "y": 0.974928}, {"x": -0.309017, "y": 0.951057}, {"x": -0.393025, "y": 0.919528}, {"x": -0.473869, "y": 0.880596}, {"x": -0.550897, "y": 0.834573}, {"x": -0.62349, "y": 0.781831}, {"x": -0.691063, "y": 0.722795}, {"x": -0.753071, "y": 0.657939}, {"x": -0.809017, "y": 0.587785}, {"x": -0.858449, "y": 0.512899}, {"x": -0.900969, "y": 0.433884}, {"x": -0.936235, "y": 0.351375}, {"x": -0.963963, "y": 0.266037}, {"x": -0.98393, "y": 0.178557}, {"x": -0.995974, "y": 0.089639}, {"x": -1.0, "y": 0.0}, {"x": -1.0, "y": 0.0}, {"x": -0.999123, "y": -0.066228}, {"x": -0.996491, "y": -0.132409}, {"x": -0.992107, "y": -0.198497}, {"x": -0.985974, "y": -0.264446}, {"x": -0.978096, "y": -0.330209}, {"x": -0.968479, "y": -0.395741}, {"x": -0.957129, "y": -0.460994}, {"x": -0.944055, "y": -0.525924}, {"x": -0.929265, "y": -0.590485}, {"x": -0.91277, "y": -0.654632}, {"x": -0.894581, "y": -0.718319}, {"x": -0.874712, "y": -0.781502}, {"x": -0.853175, "y": -0.844136}, {"x": -0.829987, "y": -0.906178}, {"x": -0.805164, "y": -0.967584}, {"x": -0.778723, "y": -1.028311}, {"x": -0.750682, "y": -1.088315}, {"x": -0.721062, "y": -1.147556}, {"x": -0.689882, "y": -1.205992}, {"x": -0.657166, "y": -1.263581}, {"x": -0.622935, "y": -1.320283}, {"x": -0.587214, "y": -1.376058}, {"x": -0.550028, "y": -1.430868}, {"x": -0.511404, "y": -1.484673}, {"x": -0.471367, "y": -1.537436}, {"x": -0.429947, "y": -1.58912}, {"x": -0.387172, "y": -1.639689}, {"x": -0.343073, "y": -1.689107}, {"x": -0.29768, "y": -1.737339}, {"x": -0.251025, "y": -1.784352}, {"x": -0.203141, "y": -1.830112}, {"x": -0.154062, "y": -1.874588}, {"x": -0.103822, "y": -1.917748}, {"x": -0.052456, "y": -1.959562}, {"x": -0.0, "y": -2.0}, {"x": 0.0, "y": -2.0}, {"x": 0.052456, "y": -1.959562}, {"x": 0.103822, "y": -1.917748}, {"x": 0.154062, "y": -1.874588}, {"x": 0.203141, "y": -1.830112}, {"x": 0.251025, "y": -1.784352}, {"x": 0.29768, "y": -1.737339}, {"x": 0.343073, "y": -1.689107}, {"x": 0.387172, "y": -1.639689}, {"x": 0.429947, "y": -1.58912}, {"x": 0.471367, "y": -1.537436}, {"x": 0.511404, "y": -1.484673}, {"x": 0.550028, "y": -1.430868}, {"x": 0.587214, "y": -1.376058}, {"x": 0.622935, "y": -1.320283}, {"x": 0.657166, "y": -1.263581}, {"x": 0.689882, "y": -1.205992}, {"x": 0.721062, "y": -1.147556}, {"x": 0.750682, "y": -1.088315}, {"x": 0.778723, "y": -1.028311}, {"x": 0.805164, "y": -0.967584}, {"x": 0.829987, "y": -0.906178}, {"x": 0.853175, "y": -0.844136}, {"x": 0.874712, "y": -0.781502}, {"x": 0.894581, "y": -0.718319}, {"x": 0.91277, "y": -0.654632}, {"x": 0.929265, "y": -0.590485}, {"x": 0.944055, "y": -0.525924}, {"x": 0.957129, "y": -0.460994}, {"x": 0.968479, "y": -0.395741}, {"x": 0.978096, "y": -0.330209}, {"x": 0.985974, "y": -0.264446}, {"x": 0.992107, "y": -0.198497}, {"x": 0.996491, "y": -0.132409}, {"x": 0.999123, "y": -0.066228}, {"x": 1.0, "y": 0.0}];
const svg = document.getElementById("svg");
const tip = document.getElementById("tip");
const NS = "http://www.w3.org/2000/svg";
let active = -1;

function showTip(ev, p) {
  tip.style.display = "block";
  tip.textContent = `X=${p.x}  Y=${p.y}`;
  tip.style.left = (ev.clientX + 12) + "px";
  tip.style.top = (ev.clientY + 12) + "px";
}
function hideTip() {
  tip.style.display = "none";
}

function el(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}
function strokeW() {
  const vb = svg.viewBox.baseVal;
  return Math.max(vb.width, vb.height) * 0.004;
}
function render() {
  const w = strokeW();
  svg.replaceChildren();
  const vb = svg.viewBox.baseVal;
  if (document.getElementById("showAxes").checked) {
    svg.appendChild(el("line", { x1: String(vb.x), y1:"0", x2: String(vb.x + vb.width), y2:"0", stroke:"#2a2f3a", "stroke-width": String(w) }));
    svg.appendChild(el("line", { x1:"0", y1: String(-vb.y - vb.height), x2:"0", y2: String(-vb.y), stroke:"#2a2f3a", "stroke-width": String(w) }));
    svg.appendChild(el("circle", { cx:"0", cy:"0", r: String(w * 1.6), fill:"#e7eaf0" }));
  }
  if (document.getElementById("showLine").checked && POINTS.length >= 2) {
    const pts = POINTS.map((p) => `${p.x},${-p.y}`).join(" ");
    svg.appendChild(el("polyline", { points: pts, fill:"none", stroke:"#3b82f6", "stroke-width": String(w * 1.6) }));
  }
  const showIndex = document.getElementById("showIndex").checked;
  const tbody = document.getElementById("tbody");
  tbody.replaceChildren();
  POINTS.forEach((p, i) => {
    const fill = i === 0 ? "#4dd8a8" : i === POINTS.length - 1 ? "#f472b6" : "#3b82f6";
    const c = el("circle", {
      class: "dot" + (i === active ? " active" : ""),
      cx: String(p.x), cy: String(-p.y),
      r: String(w * (i === 0 || i === POINTS.length - 1 ? 2.8 : 2.0)),
      fill
    });
    c.addEventListener("click", () => { active = i; render(); });
    c.addEventListener("mousemove", (ev) => showTip(ev, p));
    c.addEventListener("mouseenter", (ev) => showTip(ev, p));
    c.addEventListener("mouseleave", hideTip);
    svg.appendChild(c);
    if (showIndex) {
      svg.appendChild(el("text", {
        x: String(p.x + w * 3), y: String(-p.y - w * 3),
        fill: "#cbd5e1", "font-size": String(w * 5), "font-family":"ui-monospace,monospace"
      })).textContent = String(i);
    }
    const tr = document.createElement("tr");
    if (i === active) tr.className = "active";
    tr.innerHTML = `<td>${i}</td><td>${p.x}</td><td>${p.y}</td>`;
    tr.addEventListener("click", () => { active = i; render(); });
    tbody.appendChild(tr);
  });
  const xs = POINTS.map((p) => p.x);
  const ys = POINTS.map((p) => p.y);
  let path = 0;
  for (let i = 1; i < POINTS.length; i++) {
    const dx = POINTS[i].x - POINTS[i-1].x;
    const dy = POINTS[i].y - POINTS[i-1].y;
    path += Math.hypot(dx, dy);
  }
  document.getElementById("stats").innerHTML =
    `点数 <b>${POINTS.length}</b><br>` +
    `X [${Math.min(...xs).toFixed(4)}, ${Math.max(...xs).toFixed(4)}]<br>` +
    `Y [${Math.min(...ys).toFixed(4)}, ${Math.max(...ys).toFixed(4)}]<br>` +
    (POINTS.length >= 2 ? `折线长 <b>${path.toFixed(4)}</b>` : "");
}
["showLine","showIndex","showAxes"].forEach((id) => {
  document.getElementById(id).addEventListener("change", render);
});
render();
</script>
</body>
</html>
